[project]
name = "insight-agent"
version = "0.1.0"
description = "ML-сервис: персонализированные бизнес-инсайты и агентная логика"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "httpx==0.28.1",
    "pypdf==6.10.0",
    "beautifulsoup4==4.15.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
insight-agent = "insight_agent.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
