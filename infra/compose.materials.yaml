# Paths are relative to root compose.yaml. Explicit opt-in, never fixture fallback.
services:
  ml:
    build:
      context: ./ml-service
      args:
        GIT_SHA: '${GIT_SHA:-unknown}'
    environment:
      MATERIALS_DIR: /app/materials
      MATERIALS_PUBLIC_BASE_URL: ${MATERIALS_PUBLIC_BASE_URL:-http://127.0.0.1:${WEB_PORT:-8088}}
    volumes:
      - type: bind
        source: ${MATERIALS_STORE:-./materials}
        target: /app/materials
        read_only: true
        bind:
          create_host_path: false
  materials:
    build:
      context: ./ml-service
      args:
        GIT_SHA: '${GIT_SHA:-unknown}'
    profiles: [jobs]
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    entrypoint: [python, -m, insight_agent.materials.cli]
    command: [check, --store, /app/materials]
    environment:
      OMP_THREAD_LIMIT: '1'
    volumes:
      - type: bind
        source: ${MATERIALS_STORE:-./materials}
        target: /app/materials
        bind:
          create_host_path: false
      - type: bind
        source: ${PDF_DIR:-./materials-input/pdf}
        target: /inputs
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MATERIALS_REVIEW_DIR:-./materials-review}
        target: /review
        read_only: true
        bind:
          create_host_path: false
      - ./ml-service/config:/config:ro
  materials-poller:
    build:
      context: ./ml-service
      args:
        GIT_SHA: '${GIT_SHA:-unknown}'
    profiles: [jobs]
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    init: true
    entrypoint: [python, -m, insight_agent.materials.poller]
    command:
      - --store
      - /app/materials
      - --interval-seconds
      - '${MATERIALS_POLL_INTERVAL_SECONDS:-900}'
      - --cycle-timeout-seconds
      - '${MATERIALS_POLL_TIMEOUT_SECONDS:-600}'
    environment:
      OMP_THREAD_LIMIT: '1'
    volumes:
      - type: bind
        source: ${MATERIALS_STORE:-./materials}
        target: /app/materials
        bind:
          create_host_path: false
    stop_grace_period: 30s
    restart: 'no'
